
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Live Application</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            padding: 50px 35px;
            border-radius: 16px;
            border: 1px solid #334155;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .status {
            display: inline-block;
            background: #064e3b;
            color: #6ee7b7;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        h1 span {
            color: #38bdf8;
        }

        p {
            color: #94a3b8;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .version {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
            margin: 25px 0;
        }

        .info {
            background: #0f172a;
            border-radius: 10px;
            padding: 18px;
            font-size: 14px;
            color: #cbd5e1;
            line-height: 2;
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="status">● APPLICATION LIVE</div>

        <h1><span>V 3</span></h1>

        <p>
            Welcome to my application running on AWS EC2.
            This page is deployed automatically using Jenkins.
        </p>

        <div class="version">Hello, World!</div>

        <div class="info">
            <div><strong>Environment:</strong> Production</div>
            <div><strong>Platform:</strong> AWS EC2</div>
            <div><strong>CI/CD:</strong> Jenkins</div>
            <div><strong>Status:</strong> Deployment Successful</div>
        </div>

        <footer>
            My First CI/CD Deployment Project
        </footer>
    </div>
</body>
</html>
